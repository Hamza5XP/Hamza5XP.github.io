<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Duel</title>
<meta name="theme-color" content="#7c5cff">
<meta name="description" content="Challenge your friends to study more: log sessions, earn points, win prizes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Duel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script>
  try { var th = localStorage.getItem("studyduel.theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch (e) {}
</script>
<style>

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f2fc;--card:#ffffff;--text:#1d1b2e;--muted:#6f6b86;--line:#e6e3f3;
  --a:#7c5cff;--b:#ff7a45;--ok:#18a874;--warn:#e5484d;--gold:#f5b301;
  --shadow:0 6px 24px rgba(70,45,150,.09);--shadow-lg:0 14px 40px rgba(70,45,150,.16);
  --blob1:rgba(124,92,255,.22);--blob2:rgba(255,122,69,.18);
  --font:"Nunito","Cairo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12111b;--card:#1d1b2b;--text:#f0eefb;--muted:#9f9bb8;--line:#2e2b44;
    --a:#9a82ff;--b:#ff8f5f;--ok:#2fcf96;--warn:#ff6b70;--gold:#ffc83d;
    --shadow:0 6px 24px rgba(0,0,0,.35);--shadow-lg:0 14px 40px rgba(0,0,0,.5);
    --blob1:rgba(124,92,255,.22);--blob2:rgba(255,122,69,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#12111b;--card:#1d1b2b;--text:#f0eefb;--muted:#9f9bb8;--line:#2e2b44;
  --a:#9a82ff;--b:#ff8f5f;--ok:#2fcf96;--warn:#ff6b70;--gold:#ffc83d;
  --shadow:0 6px 24px rgba(0,0,0,.35);--shadow-lg:0 14px 40px rgba(0,0,0,.5);
  --blob1:rgba(124,92,255,.22);--blob2:rgba(255,122,69,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}
body{min-height:100%;overflow-x:hidden}
h1,h2,h3{margin:0}
#app{max-width:680px;margin:0 auto;padding:0 14px 120px;position:relative}

/* ambient background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--blob1);top:-30vmax;left:-25vmax}
.bg i:nth-child(2){background:var(--blob2);bottom:-35vmax;right:-30vmax;animation-delay:-8s}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 10px;margin:0 -2px 8px;background:linear-gradient(var(--bg) 70%,transparent);flex-wrap:wrap}
.logo{font-size:22px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .sw{display:inline-block;animation:swing 4s ease-in-out infinite;transform-origin:50% 80%}
.logo span.t{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:color-mix(in srgb,var(--card) 85%,transparent);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;backdrop-filter:blur(8px)}
.chip b{color:var(--text)}
.chip.link{cursor:pointer;transition:transform .15s}
.chip.link:active{transform:scale(.95)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:16px;font-weight:800}
.ct{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin-bottom:14px}
.ct .ci{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 22%,var(--card)),color-mix(in srgb,var(--b) 22%,var(--card)))}
.ct .r{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:700}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.center{text-align:center}
.pane{display:block}
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--a) 10%,var(--card)),var(--card) 55%,color-mix(in srgb,var(--b) 8%,var(--card)));box-shadow:var(--shadow-lg)}

/* arena */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.pl{--pc:var(--a);border-radius:20px;padding:16px 10px 14px;text-align:center;border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 13%,var(--card));position:relative;transition:transform .25s}
.pl.empty{opacity:.75;border-style:dashed;border-color:var(--line);background:var(--card)}
.pl.lead{box-shadow:0 8px 26px color-mix(in srgb,var(--pc) 35%,transparent)}
.pl.lead::after{content:"👑";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:26px;animation:crown 2.2s ease-in-out infinite}
.av{font-size:40px;line-height:1;display:inline-block;animation:floaty 4s ease-in-out infinite}
.nm{font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.pts{font-size:36px;font-weight:900;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--pc);display:inline-block}
.pts.bump{animation:bump .6s}
.lvl{font-size:12px;color:var(--muted);font-weight:700}
.flame{display:inline-block;animation:flicker 1.6s ease-in-out infinite;transform-origin:50% 90%}
.xp{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin:9px 8px 0}
.xp i{display:block;height:100%;transition:width .6s;background:var(--pc);border-radius:9px}
.vsmid{display:flex;align-items:center;font-weight:900;font-size:18px;color:var(--muted)}
.badges{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px;min-height:22px}
.badge{font-size:11px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.tug{height:14px;border-radius:99px;overflow:hidden;display:flex;margin:16px 0 5px;background:var(--line)}
.tug i{display:block;height:100%;transition:width .7s cubic-bezier(.3,1.2,.5,1)}
.tuglabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;font-weight:700}
.lb{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.lb:last-of-type{border-bottom:0}
.rk{font-size:24px;width:36px;text-align:center;flex:none;font-weight:800}
.lbm{flex:1;min-width:0}
.lb .bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:5px 0}
.lb .bar i{display:block;height:100%;transition:width .6s;border-radius:9px}
.lb .s{font-size:12px;color:var(--muted);font-weight:600}
.lb .badges{justify-content:flex-start;margin-top:4px;min-height:0}
.lb.me{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 8%,transparent),transparent);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:14px}
.invite{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-weight:600}

/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bottomnav .bar{pointer-events:auto;position:relative;display:flex;width:min(520px,100%);background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:var(--shadow-lg)}
.bottomnav button{position:relative;z-index:1;flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:11px;padding:7px 2px 6px;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:color .25s}
.bottomnav button .ic{font-size:21px;line-height:1.1;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.bottomnav button.on{color:#fff}
.bottomnav button.on .ic{transform:translateY(-1px) scale(1.18)}
.navind{position:absolute;top:6px;bottom:6px;left:0;border-radius:18px;background:linear-gradient(110deg,var(--a),var(--b));transition:transform .4s cubic-bezier(.3,1.25,.5,1),width .4s;box-shadow:0 6px 16px color-mix(in srgb,var(--a) 40%,transparent)}
.badgeN{position:absolute;top:2px;right:calc(50% - 22px);background:var(--warn);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:800;animation:bump .6s}

/* forms */
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-weight:600;padding:11px 13px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 20%,transparent)}
input:disabled{opacity:.6}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:6px 13px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.quick button:hover{border-color:var(--a)}
.quick button:active{transform:scale(.93)}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer}
.check input{width:22px;height:22px;margin:0;accent-color:var(--a)}
.btn{border:0;border-radius:16px;padding:13px 18px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(110deg,var(--a),var(--b));cursor:pointer;width:100%;margin-top:14px;position:relative;overflow:hidden;box-shadow:0 8px 20px color-mix(in srgb,var(--a) 30%,transparent);transition:transform .15s,box-shadow .2s,filter .2s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover::after{left:130%}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--bg);color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost::after{display:none}
.btn.danger{background:var(--warn)}
.btn.small{width:auto;padding:8px 14px;margin:0;font-size:13px;border-radius:12px}
.preview{margin-top:14px;padding:11px 12px;border-radius:14px;background:var(--bg);border:1.5px dashed var(--line);font-weight:800;text-align:center}
.preview span{color:var(--ok);display:inline-block}
.preview span.tick{animation:bump .4s}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .m{flex:1;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);font-weight:600}
.item .p{font-weight:900;color:var(--ok);white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:10px;transition:background .2s,color .2s}
.x:hover{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.mav{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none;border:2px solid var(--c,var(--a));background:color-mix(in srgb,var(--c,var(--a)) 14%,var(--card))}
.tag{font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;background:color-mix(in srgb,var(--gold) 22%,var(--card));color:var(--text);margin-left:6px;vertical-align:middle}
.lock{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-weight:700}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.codebig{font-size:26px;font-weight:900;letter-spacing:.18em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.coderow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:16px;padding:12px 14px;margin-bottom:6px}

/* today ring */
.today{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:var(--line)}
.ring .pg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:16px;line-height:1.1}
.ring .lab small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.sub{margin:8px 0}
.sub .bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.sub .bar i{display:block;height:100%;border-radius:9px;transition:width .6s}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--bg);border-radius:16px;padding:11px 13px}
.tile .k{font-size:12px;color:var(--muted);font-weight:700}
.tile .v{font-size:21px;font-weight:900}
.bars{direction:ltr;display:flex;align-items:flex-end;gap:6px;height:150px;position:relative;margin-top:10px;padding-bottom:20px}
.day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.day .pair{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.day .pair i{display:block;flex:1;max-width:18px;border-radius:6px 6px 0 0;min-height:3px;transform-origin:bottom}
.day em{font-style:normal;font-size:11px;color:var(--muted);position:absolute;bottom:-18px;font-weight:700}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed var(--ok);opacity:.7}
.goalline span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--ok);font-weight:700}

/* result */
.result{text-align:center;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 14%,var(--card)),color-mix(in srgb,var(--b) 14%,var(--card)));border-color:var(--gold);animation:pop-in .7s cubic-bezier(.2,1.4,.4,1) both}
.result h2{font-size:23px;font-weight:900}
.result .av{font-size:52px}
.prizes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.prizes.one{grid-template-columns:1fr}
.prize{background:var(--card);border-radius:16px;padding:13px;border:1.5px solid var(--line)}
.prize .lab{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.prize .slot{font-weight:900;font-size:16px;margin-top:6px;min-height:52px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.prize.win{border-color:var(--ok)} .prize.lose{border-color:var(--warn)}
.board{margin-top:12px;font-size:13px;color:var(--muted);font-weight:700}
@media(max-width:480px){.prizes{grid-template-columns:1fr}}

/* chat */
.chatbox{display:flex;flex-direction:column;gap:8px;height:clamp(240px,calc(100dvh - 400px),520px);overflow-y:auto;padding:4px 2px;scroll-behavior:smooth}
.msg{max-width:84%;padding:9px 13px;border-radius:18px;border-end-start-radius:6px;background:var(--bg);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;animation:msgin .3s cubic-bezier(.2,1.2,.4,1)}
.msg.me{align-self:flex-end;border-end-start-radius:18px;border-end-end-radius:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 22%,var(--card)),color-mix(in srgb,var(--b) 14%,var(--card)));border-color:color-mix(in srgb,var(--a) 35%,var(--line))}
.msg.whisper{border-style:dashed}
.msg .who{font-size:12px;font-weight:800;margin-bottom:2px}
.msg .meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.to{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.to button{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:6px 13px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:transform .15s}
.to button:active{transform:scale(.94)}
.to button.on{background:linear-gradient(110deg,var(--a),var(--b));color:#fff;border-color:transparent}
.emo{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.emo button{border:0;background:var(--bg);border-radius:12px;font-size:20px;padding:3px 9px;cursor:pointer;transition:transform .15s}
.emo button:active{transform:scale(1.3)}

/* gate */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.modes{grid-template-columns:1fr}}
.modes .card{margin-bottom:0;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.modes .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.modes .card .btn{margin-top:auto}
.modes .card .muted{margin-bottom:12px}
.big{font-size:38px;line-height:1;margin-bottom:8px;display:inline-block}
.float{animation:floaty 3.5s ease-in-out infinite}
.avpick{display:flex;gap:7px;flex-wrap:wrap}
.avpick button{font-size:27px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:5px 9px;cursor:pointer;transition:transform .2s,border-color .2s}
.avpick button:hover{transform:translateY(-2px)}
.avpick button.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 18%,var(--card));transform:scale(1.1)}
.avrow{display:flex;gap:6px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
.avrow span{font-size:26px}

/* toast + pops */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:700;z-index:80;max-width:90%;box-shadow:var(--shadow-lg);animation:toastin .35s cubic-bezier(.2,1.3,.4,1)}
.pop{position:fixed;pointer-events:none;font-size:22px;z-index:90;animation:pop 1.1s ease-out forwards}
.fly{position:fixed;pointer-events:none;z-index:90;font-weight:900;font-size:26px;color:var(--ok);text-shadow:0 2px 10px rgba(0,0,0,.2);animation:fly 1.2s ease-out forwards}
.shake{animation:shake .4s}
[hidden]{display:none!important}

/* keyframes */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes floaty{50%{transform:translateY(-5px)}}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes crown{50%{transform:translateX(-50%) translateY(-4px) rotate(6deg)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(.95) rotate(5deg)}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes pop-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes msgin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes pop{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px) scale(1.2)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.intro .pane>*, #gate.fresh>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.intro .pane>*:nth-child(2){animation-delay:.06s}
.intro .pane>*:nth-child(3){animation-delay:.12s}
.intro .pane>*:nth-child(4){animation-delay:.18s}
.intro .pane>*:nth-child(5){animation-delay:.24s}
.intro .pane>*:nth-child(n+6){animation-delay:.3s}
#gate.fresh>*:nth-child(2){animation-delay:.08s}
#gate.fresh>*:nth-child(3){animation-delay:.16s}
.intro .xp i,.intro .tug i,.intro .bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.intro .day .pair i{animation:growy .8s cubic-bezier(.2,.8,.2,1) both}
.result.pop-in,.prize .slot.spinning{animation:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ----- first page (landing) ----- */
.landing{position:relative;overflow:hidden;text-align:center;padding:30px 18px 24px;border-radius:30px;margin-bottom:14px;background:linear-gradient(150deg,color-mix(in srgb,var(--a) 22%,var(--card)),var(--card) 52%,color-mix(in srgb,var(--b) 20%,var(--card)));border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.landing>*{position:relative}
.landing .orb{position:absolute;border-radius:50%;filter:blur(38px);opacity:.5;animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
.landing .o1{width:190px;height:190px;background:var(--a);top:-70px;inset-inline-start:-50px}
.landing .o2{width:170px;height:170px;background:var(--b);bottom:-70px;inset-inline-end:-40px;animation-delay:-6s}
.orbit{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:84px;margin-bottom:8px}
.orbit span{font-size:calc(32px + var(--s,0) * 4px);line-height:1;animation:floaty 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * .35s);filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.ltitle{font-size:31px;font-weight:900;letter-spacing:-.02em;margin:0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.lsub{margin:6px 0 18px;color:var(--muted);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--line);border-radius:18px;padding:12px 6px;font-weight:800;font-size:13px;backdrop-filter:blur(6px)}
.step i{display:block;font-style:normal;font-size:26px;margin-bottom:5px;animation:floaty 3s ease-in-out infinite}
.step:nth-child(2) i{animation-delay:.4s}.step:nth-child(3) i{animation-delay:.8s}
.step b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:linear-gradient(110deg,var(--a),var(--b));color:#fff;font-size:11px;margin-inline-end:5px}
.feats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.feats span{font-size:12px;font-weight:800;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 82%,transparent);border-radius:99px;padding:4px 10px}
.choices{display:grid;gap:12px}
.choice{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start;transition:transform .25s,box-shadow .25s}
.choice:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.choice .cic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:28px;flex:none;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 22%,var(--card)),color-mix(in srgb,var(--b) 22%,var(--card)))}
.choice .cbody{flex:1;min-width:0}
.choice h3{font-size:17px}
.choice .btn{margin-top:12px}
.choice.primary{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 45%,var(--b)));border-color:transparent;color:#fff;box-shadow:0 14px 34px color-mix(in srgb,var(--a) 40%,transparent)}
.choice.primary .muted{color:rgba(255,255,255,.88)}
.choice.primary .cic{background:rgba(255,255,255,.22)}
.choice.primary .btn{background:#fff;color:#4a2fd1;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.codein{text-align:center;font-weight:900;font-size:22px;letter-spacing:.22em;text-transform:uppercase;direction:ltr}
@media(max-width:380px){.choice{flex-direction:column}.ltitle{font-size:27px}}

html[lang="ar"]{--font:"Cairo","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html[lang="ar"] .codebig,html[lang="ar"] .pts{letter-spacing:0}
.codebig{direction:ltr;unicode-bidi:isolate}
input[type=number],input[type=date]{text-align:start}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 2px}
.qrbox{background:#fff;border-radius:20px;padding:10px;box-shadow:var(--shadow);line-height:0;animation:pop-in .6s cubic-bezier(.2,1.4,.4,1) both}
.qrbox svg{width:min(240px,64vw);height:auto;display:block}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.btnrow .btn{flex:1 1 140px;margin-top:0}
.linktxt{font-size:12px;color:var(--muted);direction:ltr;word-break:break-all;text-align:center;background:var(--bg);border-radius:12px;padding:8px 10px;width:100%;user-select:all}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(110deg,color-mix(in srgb,var(--a) 16%,var(--card)),color-mix(in srgb,var(--b) 14%,var(--card)));border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:12px;font-weight:700;font-size:14px;animation:rise .5s both}
.banner .grow{flex:1 1 180px}
.banner .x{margin-inline-start:auto}
.banner a.btn,.banner button.btn{width:auto;margin:0;padding:8px 14px;font-size:13px;text-decoration:none;display:inline-block;border-radius:12px}

</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<div id="app">
  <header class="top">
    <div class="logo"><span class="sw">⚔️</span> <span class="t" data-i18n="app.title">Study Duel</span></div>
    <div class="chips" id="chips"></div>
  </header>

  <div id="install"></div>
  <div id="gate"></div>

  <main id="main" hidden>
    <!-- HOME -->
    <section id="tab-home" class="pane">
      <div class="card hero" id="vsCard"></div>
      <div id="resultBox"></div>
      <div class="card" id="logCard">
        <div class="ct"><span class="ci">📝</span><span data-i18n="log.title">Log a study session</span></div>
        <div id="formWrap">
          <label for="subject" style="margin-top:0" data-i18n="log.subject">Subject / task</label>
          <input id="subject" list="subjects" data-i18n-ph="log.subject.ph" maxlength="60" autocomplete="off">
          <datalist id="subjects"></datalist>
          <div class="row">
            <div>
              <label for="minutes" data-i18n="log.minutes">Minutes studied</label>
              <input id="minutes" type="number" inputmode="numeric" min="5" max="600" step="5" placeholder="45">
            </div>
            <div>
              <label for="diff" data-i18n="log.diff">Difficulty</label>
              <select id="diff">
                <option value="1" data-i18n="log.diff.1">Easy ×1</option>
                <option value="1.5" selected data-i18n="log.diff.15">Medium ×1.5</option>
                <option value="2" data-i18n="log.diff.2">Hard ×2</option>
              </select>
            </div>
          </div>
          <div class="quick" id="quick"></div>
          <label class="check"><input type="checkbox" id="done"> <span data-i18n="log.done">✅ I finished the task / chapter (+10)</span></label>
          <div class="row">
            <div>
              <label for="day" data-i18n="log.day">Day</label>
              <input id="day" type="date">
            </div>
            <div>
              <label for="note" data-i18n="log.note">Note (optional)</label>
              <input id="note" maxlength="80" data-i18n-ph="log.note.ph">
            </div>
          </div>
          <div class="preview" id="preview"></div>
          <button class="btn" id="logBtn" data-i18n="log.btn">Log it &amp; earn points</button>
        </div>
      </div>
      <div class="card" id="todayBox"></div>
    </section>

    <!-- STATS -->
    <section id="tab-stats" class="pane" hidden></section>

    <!-- CHAT -->
    <section id="tab-chat" class="pane" hidden>
      <div class="card">
        <div class="ct"><span class="ci">💬</span><span data-i18n="chat.title">Party chat</span></div>
        <div class="muted small" style="margin:-4px 0 12px" data-i18n="chat.desc"></div>
        <div class="to" id="chatTo"></div>
        <div class="chatbox" id="chatList"></div>
        <div class="quick" id="chatQuick"></div>
        <div class="row" style="margin-top:12px;align-items:center">
          <input id="chatIn" maxlength="200" data-i18n-ph="chat.ph" autocomplete="off">
          <button class="btn small" id="chatSend" style="flex:none" data-i18n="chat.send">Send</button>
        </div>
        <div class="emo" id="chatEmo"></div>
      </div>
    </section>

    <!-- PARTY -->
    <section id="tab-party" class="pane" hidden></section>
  </main>
</div>

<nav class="bottomnav" id="tabs" hidden>
  <div class="bar" id="navbar">
    <i class="navind" id="navind"></i>
    <button data-t="home" class="on"><span class="ic">🏠</span><span data-i18n="nav.home">Home</span></button>
    <button data-t="stats"><span class="ic">📊</span><span data-i18n="nav.stats">Stats</span></button>
    <button data-t="chat"><span class="ic">💬</span><span data-i18n="nav.chat">Chat</span><span class="badgeN" id="chatBadge" hidden></span></button>
    <button data-t="party"><span class="ic" id="partyIc">👥</span><span id="partyLabel" data-i18n="nav.party">Party</span></button>
  </div>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
